<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="ÉLAN 时尚档案。浏览每日秀场观察、国内外服装设计赛事和设计广场。">
  <title>ÉLAN</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <div id="root"><main class="member-entry"><h1>ÉLAN</h1><p role="status"></p><button hidden type="button" onclick="location.reload()">重新加载</button></main></div>
  <noscript>请启用 JavaScript 后浏览 ÉLAN。</noscript>
  <script type="module">
    import("./member-entry.js").catch(() => import("/member-entry.js?retry=" + Date.now())).catch(() => {
      const status = document.querySelector("#root [role=status]");
      if (status) {
        status.textContent = "栏目加载失败，请重新加载。";
        status.nextElementSibling.hidden = false;
      }
    });
  </script>
</body>
</html>

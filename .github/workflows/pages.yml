name: Publish ÉLAN

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elan-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install share cover renderer
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil fonts-noto-cjk
      - run: /usr/bin/python3 scripts/build_gate.py
      - uses: actions/cache@v4
        with:
          path: .runway-download-cache
          key: runway-zips-v1-${{ hashFiles('collection-catalog.json.gz', 'runway-supplement.json.gz', 'history-feed.json') }}
          restore-keys: runway-zips-v1-
      - name: Package runway photographs
        run: /usr/bin/python3 scripts/runway_downloads.py
      - name: Verify public membership entry
        run: |
          test -s dist/index.html
          test -s dist/member-entry.js
          test ! -e dist/data
          test ! -e dist/media
          test ! -e dist/runways
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish ÉLAN
        id: publish
        uses: actions/deploy-pages@v4
